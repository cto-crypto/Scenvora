if($("#newDay"))$("#newDay").onclick=function(){form("Shoot Day",[["title","Day title"],["date","Date (YYYY-MM-DD)"],["location","Location"],["scenes","Scene IDs"],["notes","Call time / actor reminders","", "textarea"]],function(v){state.days.push(v)})};
if($("#newRelease"))$("#newRelease").onclick=function(){form("Release milestone",[["title","Platform / event"],["date","Date"],["notes","Deliverables / approval","", "textarea"]],function(v){state.releases.push(v)})};
if($("#saveBible"))$("#saveBible").onclick=function(){document.querySelectorAll("[data-bible]").forEach(function(x){state.bible[x.dataset.bible]=x.value});save();toast("Canon saved")};
if($("#saveNotes"))$("#saveNotes").onclick=function(){state.notes=$("#dialogueNotes").value;save();toast("Notes saved")};
if($("#exportData"))$("#exportData").onclick=backup;
if($("#importData"))$("#importData").onclick=function(){$("#importFile").click()};
if($("#resetData"))$("#resetData").onclick=function(){if(confirm("Existing edits will be lost. Backup first. Reset?")){state=initial();save();render()}};
}
function backup(){var blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),data:state},null,2)],{type:"application/json"});var u=URL.createObjectURL(blob);var a=document.createElement("a");a.href=u;a.download="IKHTIYAR_STUDIO_BACKUP.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1500);toast("Backup downloaded")}
$("#backup").onclick=backup;
$("#importFile").onchange=async function(e){var file=e.target.files[0];if(!file)return;try{var obj=JSON.parse(await file.text()),d=obj.data||obj;if(!Array.isArray(d.scenes)||!Array.isArray(d.tasks))throw Error("Invalid");if(!confirm("Import se current project replace hoga. Continue?"))return;state=Object.assign(initial(),d);save();render();toast("Project restored")}catch(err){toast("Invalid backup")}e.target.value=""};
$("#menu").onclick=function(){$("#side").classList.add("open");$("#backdrop").classList.add("show")};
$("#backdrop").onclick=function(){closeDrawer();closeSide()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDrawer();closeSide()}});
render();
})();
</script></body></html>
